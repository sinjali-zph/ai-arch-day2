name: issues-action-demo

on:
  issues:
    types: [opened, edited]

jobs:
  show-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Show issue details
        run: |
          echo "## Issue context"
          echo "Title: ${{ github.event.issue.title }}"
          echo "Body: ${{ github.event.issue.body }}"
